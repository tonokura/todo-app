<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <header>
    <h1 class="header-title">Discipline</h1>
  <div class="header-box">
    <div id="today" class="date-display"></div>
    <h2 class="main-task">今日やる事を入力して下さい</h2>
    <div class="input-box"> 
    <input type="text" id="task-input" placeholder="タスクを入力">　<!--placeholder=：中身に書く分が表示される-->
    <button id="add-button">追加</button>
   </div> 
  </div>
  </header> 

<main> 
    <div class="main-box">
      <ul id="task-list" class="task-list"></ul>
    </div>    
</main>

<footer>
  <div id = "count">
    <div id = "number"></div>
  </div>
</footer>

  <script src="script.js"> </script>
</body>
</html>
